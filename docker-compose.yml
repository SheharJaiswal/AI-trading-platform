services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_trading
      MYSQL_USER: ai_trading
      MYSQL_PASSWORD: ai_trading_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/database/mysql-v1.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
