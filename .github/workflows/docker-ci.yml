name: docker-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'feat/**']

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build --pull
