name: dotnet-ci

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: ai_trading_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      AI_TRADING_MYSQL_CONNECTION: Server=127.0.0.1;Port=3306;Database=ai_trading_test;User=root;Password=test;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AI-Trading-Platform.sln
      - name: Build
        run: dotnet build AI-Trading-Platform.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test AI-Trading-Platform.sln --configuration Release --no-build --verbosity normal
      - name: Frontend install
        working-directory: web
        run: npm install
      - name: Frontend build
        working-directory: web
        run: npm run build
      - name: Frontend test
        working-directory: web
        run: npm test
